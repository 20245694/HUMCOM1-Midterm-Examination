<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body align="center" style="overflow: hidden;">

    <table width="100%" cellpadding="1" cellspacing="5" bgcolor="#22252A">
        <tr align="center">
            <td>
                <h1><font size="7" color="white">Calaunan's Midterm Portfolio</font></h1>
            </td>
        </tr>
    </table>
    
    <hr class="header-divider">

    <nav>
        <table width="100%" cellpadding="15" cellspacing="5" bgcolor="#22252A">
            <tr align="center">
                <td><a href="index.html"><font color="white"><b>Home</b></font></a></td>
                <td><a href="about.html"><font color="white"><b>About</b></font></a></td>
                <td><a href="services.html"><font color="white"><b>Services</b></font></a></td>
                <td><a href="media.html"><font color="white"><b>Media</b></font></a></td>
                <td><a href="contact.html"><font color="white"><b>Contact</b></font></a></td>
            </tr>
        </table>
    </nav>

    <h1> </h1>

    <img src="profile image.jpeg" width="200" height="200" style="border-radius: 50%; object-fit: cover;">

    <h1>Contact</h1>
    <h2></h2>

    <form action="https://formspree.io" method="POST">
        <table align="center" cellpadding="5" cellspacing="0">
            <tr>
                <td>
                    <fieldset>
                        <legend><b>Get in Touch</b></legend>
                        
                        <table cellpadding="8" cellspacing="0">
                            <tr>
                                <td align="right">
                                    <label for="full-name">Full Name:</label>
                                </td>
                                <td align="left">
                                    <input type="text" id="full-name" name="name" minlength="3" required placeholder="Full Name">
                                </td>
                            </tr>
                            
                            <tr>
                                <td align="right">
                                    <label for="email-address">Email:</label>
                                </td>
                                <td align="left">
                                    <input type="email" id="email-address" name="email" required placeholder="Email Address">
                                </td>
                            </tr>
                            
                            <tr>
                                <td align="right">
                                    <label for="form-topic">Topic:</label>
                                </td>
                                <td align="left">
                                    <select id="form-topic" name="topic" required>
                                        <option value="" disabled selected>-- Select a Topic --</option>
                                        <option value="web-design">Human Computer Interaction</option>
                                        <option value="collaboration">Collaboration</option>
                                        <option value="general-inquiry">Coding</option>
                                    </select>
                                </td>
                            </tr>
                            
                            <tr>
                                <td align="right" valign="top">
                                    <label for="form-message">Message:</label>
                                </td>
                                <td align="left">
                                    <textarea id="form-message" name="message" rows="5" cols="25" minlength="3" required placeholder="Type your message here..."></textarea>
                                </td>
                            </tr>
                            
                            <!-- Submit Button -->
                            <tr>
                                <td></td>
                                <td align="left">
                                    <input type="submit" value="Send Message">
                                </td>
                            </tr>
                        </table>
                    </fieldset>
                </td>
            </tr>
        </table>
    </form>

    <h1> </h1>

    <footer>
        <table cellpadding="10" width="100%" bgcolor="#22252A">
            <tr>
                <td align="center">
                    <p><font color="white">&copy; Developed by Dwein Markeen S. Calaunan | HUMAN-COMPUTER INTERACTION</font></p>
                </td>
            </tr>
        </table>
    </footer>

</body>
</html>
